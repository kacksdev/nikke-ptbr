name: Fonte oficial relevante
description: Compartilhe uma política ou documentação primária que altere a análise.
title: "[FONTE] "
labels:
  - documentation
body:
  - type: input
    id: url
    attributes:
      label: Link oficial
      description: Use um endereço da empresa, Unity, Microsoft ou repositório oficial da ferramenta.
    validations:
      required: true
  - type: textarea
    id: relevance
    attributes:
      label: O que esta fonte esclarece?
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Confirmação
      options:
        - label: Não incluí arquivos do jogo, dados pessoais, credenciais ou técnicas de contorno.
          required: true
