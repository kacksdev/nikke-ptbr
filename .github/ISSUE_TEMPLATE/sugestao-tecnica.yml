name: Sugestão técnica
description: Sugira uma melhoria compatível com a arquitetura do mod de tradução.
title: "[TÉCNICO] "
labels:
  - engenharia
body:
  - type: textarea
    id: suggestion
    attributes:
      label: Sugestão
      description: Explique a ferramenta, abordagem ou melhoria e como ela se aplica ao mod de tradução.
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: Benefício esperado
      description: Descreva o ganho de compatibilidade, estabilidade, desempenho ou qualidade.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Confirmação
      options:
        - label: Não incluí arquivos do jogo, builds privadas, credenciais ou dados pessoais.
          required: true
